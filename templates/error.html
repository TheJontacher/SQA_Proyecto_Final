{% extends 'layout.html' %}
{% block title %}{{ titulo }}{% endblock %}

{% block content %}
<div class="max-w-md mx-auto mt-16 text-center bg-white rounded-lg shadow-md content-card p-10">
    <p class="text-6xl font-black text-petroleo">{{ codigo }}</p>
    <h2 class="text-xl font-bold text-gray-800 mt-3">{{ titulo }}</h2>
    <p class="text-sm text-gray-500 mt-2">{{ mensaje }}</p>
    <a href="{{ url_for('dashboard') }}" class="btn-primary inline-block mt-6 px-6 py-2.5 rounded-md font-bold">Volver al inicio</a>
</div>
{% endblock %}
